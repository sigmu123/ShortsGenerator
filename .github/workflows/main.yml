name: Generate Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Topic or Prompt for the Short'
        required: true
        default: 'Top 5 Mind-Blowing Facts About Black Holes'
      duration:
        description: 'Duration in seconds'
        required: false
        default: '45'
      subtitle_style:
        description: 'Subtitle Style (mrbeast, hormozi, neon, minimal)'
        required: false
        default: 'mrbeast'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Media Tools (FFmpeg & ImageMagick)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          # Fix ImageMagick security policy for MoviePy subtitle text rendering
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@\*"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Backend/requirements.txt

      - name: Run Video Generator CLI
        id: generate-video
        env:
          PROMPT_INPUT: ${{ github.event.inputs.prompt }}
          DURATION: ${{ github.event.inputs.duration }}
          SUBTITLE_STYLE: ${{ github.event.inputs.subtitle_style }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python Backend/main.py

      - name: Upload Generated Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-video
          path: Backend/static/generated_videos/*.mp4
          if-no-files-found: error
          retention-days: 7
